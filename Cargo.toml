[package]
name = "gpu-memory-tester"
version = "0.1.0"
edition = "2024"
description = "GPU memory bandwidth & latency tester (Metal / CUDA)"
license = "MIT"
repository = "https://github.com/PERRETJonatan/gpu-memory-tester"

[features]
default = ["metal"]
metal = ["dep:metal"]
cuda = ["dep:cudarc"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "cuda-12080", "dynamic-loading", "driver", "nvrtc"], optional = true }
anyhow = "1.0.104"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
